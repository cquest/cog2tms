[project]
name = "cog2tms"
description = "Serve TMS tiles (EPSG:3857) from a remote COG read over HTTP byte-range"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "requests>=2.31",
    "pillow>=10",
    "numpy>=1.26",
    # ~3x faster JPEG-in-TIFF decode than Pillow, pixel-identical, releases the GIL;
    # small wheels (linux/mac/windows) and the code still works without it
    "simplejpeg>=1.6",
    # warp: cv2.remap is ~12x faster than the numpy bilinear gather (the dominant
    # render step) and releases the GIL; headless wheels, no system libraries —
    # the biggest dependency (61 MB wheel), worth it for the render speed
    "opencv-python-headless>=4.12",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
markers = ["network: integration tests on remote COGs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]
