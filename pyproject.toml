[project]
name = "cog2tms"
description = "Serve TMS tiles (EPSG:3857) from a remote COG read over HTTP byte-range"
license = "WTFPL"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "requests>=2.31",
    "pillow>=10",
    "numpy>=1.26",
    "simplejpeg>=1.6",
    "imagecodecs>=2024.1",
    "opencv-python-headless>=4.12",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx"]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
markers = ["network: integration tests on remote COGs"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_also = ["except ImportError:"]  # codec fallback paths need the wheel absent
fail_under = 75  # measured offline: 78% (offline+network: 82%) — retune up as tests grow

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]
