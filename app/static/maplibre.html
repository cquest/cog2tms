<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; worker-src blob:; connect-src 'self' tiles.openfreemap.org http://127.0.0.1:8111; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'">
<title>cog2tms</title>
<link rel="stylesheet" href="/static/maplibre-gl.css">
<style>
:root { --line: #d5d9de; --fg: #1c2530; --mut: #5b6672; --acc: #0b62ce; --err: #a4123f; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, sans-serif; color: var(--fg);
       display: flex; flex-direction: column; height: 100vh; }
header { padding: 10px 14px 6px; }
h1 { margin: 0; font-size: 19px; }
h1 small { color: var(--mut); font-weight: normal; font-size: 13px; margin-left: 8px; }
h1 a { color: var(--acc); font-size: 13px; margin-left: 8px; }
h2 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--mut); }
form { display: flex; gap: 8px; padding: 8px 14px; }
input, select, button { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; background: #fff; }
form input { flex: 1; min-width: 0; }
button { cursor: pointer; background: var(--acc); border-color: var(--acc); color: #fff; }
#params { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 2px 14px 8px; align-items: center; color: var(--mut); }
#params label { display: inline-flex; gap: 5px; align-items: center; }
#params input, #params select { width: auto; }
#params .num { width: 64px; }
#err { display: none; margin: 0 14px 8px; padding: 8px 10px; border-radius: 5px;
       background: #fdecef; color: var(--err); border: 1px solid #f3c1cd; }
#err.show { display: block; }
main { flex: 1; display: flex; min-height: 0; }
#map { flex: 1; min-width: 0; background: #e8ebee; }
aside { width: 340px; flex: none; overflow-y: auto; padding: 10px 14px; border-left: 1px solid var(--line); }
aside section { margin-bottom: 14px; }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
dt { color: var(--mut); }
dd { margin: 0; overflow-wrap: anywhere; }
.row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.row code { flex: 1; font: 12px/1.4 ui-monospace, monospace; background: #f2f4f6; padding: 3px 6px;
            border-radius: 4px; overflow-wrap: anywhere; }
.row button { background: #fff; color: var(--fg); border-color: var(--line); padding: 2px 8px; flex: none; }
#curtile { font: 13px ui-monospace, monospace; color: var(--mut); }
.muted { color: var(--mut); }
</style>
</head>
<body>
<header>
  <h1>cog2tms <small>Serves map tiles as TMS from a Cloud Optimized GeoTIFF (COG).</small>
</header>

<form id="loadform">
  <input id="url" type="url" placeholder="https://example.org/image_cog.tif" required spellcheck="false">
  <button type="submit">Load</button>
</form>

<div id="params">
  <label>format
    <select id="format"><option>auto</option><option>png</option><option>jpeg</option><option>webp</option></select></label>
  <label>quality <input id="quality" class="num" type="number" min="1" max="95" value="80"></label>
  <label>size
    <select id="size"><option>256</option><option>512</option></select></label>
  <label>blackmax <input id="blackmax" class="num" type="text" value="20"
         title="near-black pixels become transparent; -1 disables"></label>
  <label hidden><input hidden id="bidx" type="text" placeholder="1,2,3" size="6"></label>
  <label hidden><input hidden id="rescale" type="text" placeholder="min,max" size="10"></label>
  <label><input id="base" type="checkbox" checked> vector basemap (OpenFreeMap bright)</label>
  <label>opacity <input id="opacity" type="range" min="0" max="100" value="100"></label>
</div>

<div id="err" role="alert"></div>

<main>
  <div id="map"></div>
  <aside>
    <section id="urls" hidden>
      <h3>TMS Tile URLs</h3>
      <div class="row"><code id="u-xyz"></code><button data-copy="u-xyz">copy</button></div>
      <h3>JOSM definition</h3>
      <div class="row"><code id="u-josm"></code><button data-copy="u-josm">copy</button>
        <button id="josm-open" title="add this layer to a running JOSM (Remote Control, port 8111)">open in JOSM</button></div>
    </section>

    <section id="info" hidden>
      <h2>COG</h2>
      <dl id="infodl"></dl>
    </section>

    <section>
      <h2>Tile under cursor</h2>
      <span id="curtile">&mdash;</span>
    </section>
      <p class="muted">Z/X/Y numbering, Y points down (same as OSM/Leaflet); JOSM "tms:" form
      included. Only parameters differing from the service defaults appear in the URLs.</p>
  </aside>
</main>

<script src="/static/maplibre-gl.js"></script>
<script src="/static/maplibre_app.js"></script>
</body>
</html>
